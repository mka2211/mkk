<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Infinity: Наша Вселенная</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Montserrat:wght@100;300;600&family=Dancing+Script:wght@700&display=swap" rel="stylesheet">

    <style>
        /* --- СЕКЦИЯ 1: ГЛОБАЛЬНЫЕ СТИЛИ --- */
        :root {
            --primary: #ff2d55;
            --gold: #d4af37;
            --dark: #0a0a0a;
            --glass: rgba(255, 255, 255, 0.03);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        body, html {
            background-color: var(--dark);
            color: #ffffff;
            font-family: 'Montserrat', sans-serif;
            overflow: hidden;
            height: 100%;
            width: 100%;
        }

        canvas {
            position: fixed;
            top: 0;
            left: 0;
            z-index: 1;
            pointer-events: none;
        }

        /* --- СЕКЦИЯ 2: АНИМАЦИИ --- */
        @keyframes heartbeat {
            0% { transform: scale(1); filter: drop-shadow(0 0 5px var(--primary)); }
            15% { transform: scale(1.15); filter: drop-shadow(0 0 20px var(--primary)); }
            30% { transform: scale(1); filter: drop-shadow(0 0 5px var(--primary)); }
            45% { transform: scale(1.15); filter: drop-shadow(0 0 20px var(--primary)); }
            100% { transform: scale(1); }
        }

        @keyframes float {
            0% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(2deg); }
            100% { transform: translateY(0px) rotate(0deg); }
        }

        @keyframes spin-disk {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        @keyframes scanline {
            0% { bottom: 100%; }
            100% { bottom: 0%; }
        }

        @keyframes bg-glow {
            0% { background: radial-gradient(circle at 50% 50%, #1a050a 0%, #000 70%); }
            50% { background: radial-gradient(circle at 60% 40%, #1a050a 0%, #000 75%); }
            100% { background: radial-gradient(circle at 50% 50%, #1a050a 0%, #000 70%); }
        }

        /* --- СЕКЦИЯ 3: КОМПОНЕНТЫ ИНТЕРФЕЙСА --- */
        #loader {
            position: fixed;
            inset: 0;
            background: #000;
            z-index: 999;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: opacity 2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .heart-trigger {
            font-size: 80px;
            cursor: pointer;
            animation: heartbeat 2s infinite;
            transition: all 0.5s ease;
        }

        .heart-trigger:hover {
            transform: scale(1.3);
            filter: drop-shadow(0 0 30px var(--primary));
        }

        #main-wrapper {
            opacity: 0;
            visibility: hidden;
            transition: opacity 3s ease;
            z-index: 10;
            position: relative;
            height: 100vh;
        }

        .vinyl-container {
            position: fixed;
            top: 40px;
            right: 40px;
            z-index: 100;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .vinyl {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: repeating-radial-gradient(circle, #111 0, #111 2px, #222 3px, #111 4px);
            border: 4px solid #333;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: box-shadow 0.5s;
        }

        .vinyl.playing {
            animation: spin-disk 4s linear infinite;
            box-shadow: 0 0 25px var(--primary);
        }

        .vinyl-center {
            width: 30px;
            height: 30px;
            background: var(--primary);
            border-radius: 50%;
            border: 2px solid #000;
        }

        .cinema-text-engine {
            position: absolute;
            top: 45%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            width: 90%;
            max-width: 800px;
        }

        .phrase-line {
            font-size: 1.8rem;
            font-weight: 200;
            letter-spacing: 8px;
            text-transform: uppercase;
            opacity: 0;
            transform: translateY(40px);
            transition: all 1.5s ease;
            margin-bottom: 20px;
            color: rgba(255, 255, 255, 0.9);
        }

        .phrase-line.active {
            opacity: 1;
            transform: translateY(0);
        }

        .romantic-script {
            font-family: 'Dancing Script', cursive;
            text-transform: none;
            letter-spacing: 2px;
            color: var(--primary);
            font-size: 3rem;
        }

        .stats-footer {
            position: fixed;
            bottom: 50px;
            width: 100%;
            text-align: center;
        }

        .big-counter {
            font-family: 'Cinzel', serif;
            font-size: 5rem;
            font-weight: 700;
            background: linear-gradient(180deg, #fff 0%, #444 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
        }

        .counter-label {
            letter-spacing: 12px;
            font-size: 10px;
            text-transform: uppercase;
            color: var(--primary);
            opacity: 0.7;
        }

        .overlay-vignette {
            position: fixed;
            inset: 0;
            background: radial-gradient(circle, transparent 40%, rgba(0,0,0,0.8) 100%);
            pointer-events: none;
            z-index: 5;
        }

        /* --- СЕКЦИЯ 4: АДАПТИВНОСТЬ ДЛЯ ТЕЛЕФОНОВ И ПЛАНШЕТОВ --- */
        @media (max-width: 768px) {
            .vinyl-container {
                top: 20px;
                right: 20px;
            }
            .vinyl {
                width: 60px;
                height: 60px;
                border-width: 2px;
            }
            .vinyl-center {
                width: 16px;
                height: 16px;
                border-width: 1px;
            }
            #song-title {
                font-size: 6px !important;
                letter-spacing: 1px !important;
                margin-top: 5px !important;
            }
            .phrase-line {
                font-size: 1.2rem;
                letter-spacing: 4px;
                margin-bottom: 15px;
            }
            .romantic-script {
                font-size: 2.2rem;
            }
            .big-counter {
                font-size: 3.5rem;
            }
            .stats-footer {
                bottom: 30px;
            }
            .counter-label {
                letter-spacing: 6px;
                font-size: 8px;
            }
            .heart-trigger {
                font-size: 60px;
            }
        }

        @media (max-width: 480px) {
            .cinema-text-engine {
                top: 40%;
            }
            .phrase-line {
                font-size: 0.9rem;
                letter-spacing: 2px;
                margin-bottom: 10px;
            }
            .romantic-script {
                font-size: 1.8rem;
            }
            .big-counter {
                font-size: 2.5rem;
            }
            .counter-label {
                letter-spacing: 4px;
                font-size: 7px;
            }
            .heart-trigger {
                font-size: 50px;
            }
        }
    </style>
</head>
<body>

    <div class="overlay-vignette"></div>
    <canvas id="starfield"></canvas>

    <div id="loader">
        <div class="heart-trigger" onclick="initExperience()">❤️</div>
        <p style="margin-top: 30px; letter-spacing: 5px; font-size: 10px; opacity: 0.5; text-transform: uppercase; text-align: center; padding: 0 20px;">Нажми на сердце, чтобы начать</p>
    </div>

    <div id="main-wrapper">
        <div class="vinyl-container">
            <div id="vinyl-disk" class="vinyl" onclick="togglePlay()">
                <div class="vinyl-center"></div>
            </div>
            <p id="song-title" style="font-size: 8px; margin-top: 10px; opacity: 0.4; letter-spacing: 2px;">LA CASA DE PAPEL</p>
        </div>

        <div class="cinema-text-engine">
            <div id="line1" class="phrase-line">В мире из восьми миллиардов</div>
            <div id="line2" class="phrase-line">Моя вселенная выбрала</div>
            <div id="line3" class="phrase-line romantic-script">Именно Тебя</div>
        </div>

        <div class="stats-footer">
            <div id="main-counter" class="big-counter">0</div>
            <div class="counter-label">Секунд любви и преданности</div>
        </div>

        <audio id="bg-audio" loop>
            <source src="Atresmúsica - La Casa de Papel.mp3" type="audio/mpeg">
        </audio>
    </div>

    <script>
        /* --- JS ЛОГИКА --- */
        
        const audio = document.getElementById('bg-audio');
        const disk = document.getElementById('vinyl-disk');
        const startDate = new Date("2024-01-01T00:00:00"); // ТВОЯ ДАТА ТУТ
        
        // 1. Инициализация опыта
        function initExperience() {
            // Прячем лоадер
            document.getElementById('loader').style.opacity = '0';
            
            setTimeout(() => {
                document.getElementById('loader').remove();
                const wrapper = document.getElementById('main-wrapper');
                wrapper.style.visibility = 'visible';
                wrapper.style.opacity = '1';
                
                // Запуск музыки
                audio.play().catch(e => console.log("Музыка ждет взаимодействия"));
                disk.classList.add('playing');
                
                // Запуск визуальных эффектов
                startCinematicText();
                updateCounter();
                fireConfetti();
            }, 1500);
        }

        // 2. Управление плеером
        function togglePlay() {
            if (audio.paused) {
                audio.play();
                disk.classList.add('playing');
            } else {
                audio.pause();
                disk.classList.remove('playing');
            }
        }

        // 3. Кинематографичный текст
        const phrases = [
            ["В бесконечном потоке времени...", "Есть только один момент...", "Тот, где мы вместе"],
            ["Каждый вздох...", "Каждая мысль...", "Принадлежит тебе"],
            ["Ты мой лучший план...", "Моя самая большая победа...", "Моя Белла Чао"]
        ];
        let setIdx = 0;

        function startCinematicText() {
            const lines = [document.getElementById('line1'), document.getElementById('line2'), document.getElementById('line3')];
            const currentSet = phrases[setIdx];

            lines.forEach((line, i) => {
                setTimeout(() => {
                    line.innerText = currentSet[i];
                    line.classList.add('active');
                }, i * 2000);

                setTimeout(() => {
                    line.classList.remove('active');
                }, 7000 + (i * 500));
            });

            setIdx = (setIdx + 1) % phrases.length;
            setTimeout(startCinematicText, 10000);
        }

        // 4. Супер-точный счетчик
        function updateCounter() {
            const now = new Date();
            const difference = Math.floor((now - startDate) / 1000);
            
            // Плавная анимация цифр
            document.getElementById('main-counter').innerText = difference.toLocaleString();
            requestAnimationFrame(updateCounter);
        }

        // 5. Движок звездной пыли (Canvas)
        const canvas = document.getElementById('starfield');
        const ctx = canvas.getContext('2d');
        let particles = [];

        class Particle {
            constructor() {
                this.reset();
            }
            reset() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.size = Math.random() * 2 + 0.1;
                this.speedX = (Math.random() - 0.5) * 0.3;
                this.speedY = (Math.random() - 0.5) * 0.3;
                this.opacity = Math.random();
            }
            update() {
                this.x += this.speedX;
                this.y += this.speedY;
                if (this.x > canvas.width || this.x < 0 || this.y > canvas.height || this.y < 0) this.reset();
            }
            draw() {
                ctx.fillStyle = `rgba(255, 45, 85, ${this.opacity})`;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        function initParticles() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            particles = [];
            for (let i = 0; i < 300; i++) particles.push(new Particle());
        }

        function animateParticles() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach(p => {
                p.update();
                p.draw();
            });
            requestAnimationFrame(animateParticles);
        }

        // 6. Спецэффекты
        function fireConfetti() {
            const duration = 15 * 1000;
            const animationEnd = Date.now() + duration;
            const defaults = { startVelocity: 30, spread: 360, ticks: 60, zIndex: 0 };

            function randomInRange(min, max) { return Math.random() * (max - min) + min; }

            const interval = setInterval(function() {
                const timeLeft = animationEnd - Date.now();
                if (timeLeft <= 0) return clearInterval(interval);

                const particleCount = 50 * (timeLeft / duration);
                confetti(Object.assign({}, defaults, { particleCount, origin: { x: randomInRange(0.1, 0.3), y: Math.random() - 0.2 } }));
                confetti(Object.assign({}, defaults, { particleCount, origin: { x: randomInRange(0.7, 0.9), y: Math.random() - 0.2 } }));
            }, 250);
        }

        window.addEventListener('resize', initParticles);
        initParticles();
        animateParticles();

        // 7. Интерактив с мышкой (шлейф)
        window.addEventListener('mousemove', (e) => {
            const p = new Particle();
            p.x = e.clientX;
            p.y = e.clientY;
            p.speedX = (Math.random() - 0.5) * 2;
            p.speedY = (Math.random() - 0.5) * 2;
            p.opacity = 1;
            particles.shift();
            particles.push(p);
        });

    </script>
</body>
</html>
